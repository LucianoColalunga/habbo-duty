<!doctype html>
<!--
  Plantilla de la imagen para compartir en redes (1200 x 630).
  No se publica: solo la usa tools/images/render-png.mjs para sacar la captura.
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<title>OG Habbo Duty</title>
<style>
  @font-face { font-family: "Chakra Petch"; font-weight: 700; src: url("../../public/assets/fonts/chakra-petch-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Press Start 2P"; src: url("../../public/assets/fonts/press-start-2p-latin-400-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #07080a; color: #eef2f5; font-family: "Chakra Petch", sans-serif; }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(50% 60% at 78% 45%, rgb(157 255 82 / .16), transparent 70%),
      radial-gradient(35% 45% at 5% 10%, rgb(56 189 255 / .14), transparent 70%),
      radial-gradient(35% 40% at 100% 100%, rgb(255 68 56 / .14), transparent 70%),
      linear-gradient(rgb(255 255 255 / .045) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgb(255 255 255 / .045) 1px, transparent 1px) 0 0 / 48px 48px; }
  .art { position: absolute; right: -10px; top: 40px; width: 720px; }
  .copy { position: absolute; left: 64px; top: 70px; width: 520px; }
  .logo { display: flex; align-items: center; gap: 18px; }
  .logo img { width: 64px; image-rendering: pixelated; filter: drop-shadow(0 0 14px rgb(157 255 82 / .5)); }
  .logo span { font-family: "Press Start 2P", monospace; font-size: 26px; }
  .logo b { color: #9dff52; font-weight: 400; margin-left: 12px; }
  h1 { margin-top: 48px; font-size: 68px; line-height: .95; text-transform: uppercase; }
  h1 em { font-style: normal; background: linear-gradient(95deg, #9dff52 10%, #d8ff6a 45%, #38bdff 95%); -webkit-background-clip: text; color: transparent; }
  .modes { display: flex; gap: 12px; margin-top: 40px; }
  .modes span { font-family: "Press Start 2P", monospace; font-size: 15px; padding: 12px 14px; border: 2px solid; }
  .r { color: #ff4438; } .b { color: #38bdff; } .g { color: #9dff52; }
  .foot { position: absolute; left: 64px; bottom: 40px; font-family: "Press Start 2P", monospace; font-size: 12px; color: #9aa3ad; }
</style>
</head>
<body>
  <div class="bg"></div>
  <img class="art" src="../../public/assets/img/hero-battle.svg" alt="" />
  <div class="copy">
    <div class="logo"><img src="../../public/assets/img/badge.svg" alt="" /><span>Habbo<b>Duty</b></span></div>
    <h1>El <em>campo de batalla</em> de Habbo te espera</h1>
    <div class="modes"><span class="r">1 vs 1</span><span class="b">2 vs 2</span><span class="g">5 vs 5</span></div>
  </div>
  <p class="foot">Juego de la comunidad · Fan site no oficial</p>
</body>
</html>
